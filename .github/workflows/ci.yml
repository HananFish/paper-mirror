name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: python scripts/setup.py
      - name: Public files and history
        run: python scripts/check_public_repo.py
      - name: Offline backend and document checks
        run: python scripts/run_tests.py
      - name: Dependency audit
        run: npm --prefix frontend audit --audit-level=moderate
      - name: Reading history checks
        run: npm --prefix frontend run test:history
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Browser interaction checks
        run: npm --prefix frontend run test:browser
      - name: Diff formatting
        run: git diff --check
